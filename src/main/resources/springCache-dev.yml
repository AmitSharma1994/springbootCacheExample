spring:
  application:
    name: springBootCacheExample
  sql:
    init:
      mode: never
  docker:
    compose:
      profiles:
        active: infra

  datasource:
    url: jdbc:h2:file:./data/productdb
    driverClassName: org.h2.Driver
    username: sa
    password: sid@123

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: redis

server:
  port: 8089

redis:
  shards:
    - host: localhost
      port: 6379
    - host: localhost
      port: 6380
